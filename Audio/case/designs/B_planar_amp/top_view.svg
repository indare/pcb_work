<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="640" height="720">
  <title>AudioCase B Planar Amp Floor  top view (mm)</title>
  <desc>Internal W250 x D280. Origin front-left. Scale 1mm = 1 SVG unit (offset +30,+40).</desc>
  <style>
    .box { fill: none; stroke: #222; stroke-width: 1.2; }
    .f1 { fill: #e8f1ff; stroke: #1a5fb4; stroke-width: 1; }
    .f2 { fill: #ffe8cc; stroke: #c64600; stroke-width: 1; }
    .pwr { fill: #e6ffe6; stroke: #2a7a2a; stroke-width: 1; }
    .duct { fill: #f0f0f0; stroke: #666; stroke-width: 0.8; stroke-dasharray: 3 2; }
    .label { font-family: "IBM Plex Sans", "Noto Sans", sans-serif; font-size: 7px; fill: #222; }
    .title { font-family: "IBM Plex Sans", "Noto Sans", sans-serif; font-size: 11px; font-weight: 600; fill: #111; }
    .dim { font-family: "IBM Plex Mono", "Noto Sans Mono", monospace; font-size: 6.5px; fill: #333; }
    .hole { fill: #444; }
  </style>

  <!-- offset: ox=30 oy=40; Y grows downward in SVG = toward rear -->
  <text x="30" y="22" class="title">Variant B  Planar Amp Floor (top)  Ö¯ 250 ◊ 280 mm</text>
  <text x="30" y="34" class="dim">1F Controll+ADC / 2F Amp◊10 (5◊2) + Power rear ∑ scale 1 SVG unit = 1 mm</text>

  <!-- outer inner box -->
  <rect x="30" y="40" width="250" height="280" class="box"/>
  <text x="140" y="52" class="label">FRONT</text>
  <text x="142" y="312" class="label">REAR</text>
  <text x="8" y="180" class="dim" transform="rotate(-90 8 180)">D 280</text>
  <text x="140" y="332" class="dim">W 250</text>

  <!-- 1F ADC -->
  <rect x="63.7" y="48" width="182.6" height="83.7" class="f1"/>
  <text x="110" y="90" class="label">1F MeasurementADC 182.6◊83.7</text>
  <text x="120" y="100" class="label">LCD í front opening</text>
  <!-- ADC holes approx -->
  <circle cx="67.2" cy="51.5" r="1.2" class="hole"/>
  <circle cx="141.34" cy="51.51" r="1.2" class="hole"/>
  <circle cx="242.78" cy="51.51" r="1.2" class="hole"/>
  <circle cx="67.17" cy="128.2" r="1.2" class="hole"/>
  <circle cx="153.09" cy="128.22" r="1.2" class="hole"/>
  <circle cx="242.79" cy="128.18" r="1.2" class="hole"/>

  <!-- Controll child -->
  <rect x="50" y="135.7" width="98.2" height="162.95" class="f1"/>
  <text x="65" y="210" class="label">1F Controll P</text>
  <text x="68" y="220" class="label">98.2◊163 rot</text>

  <!-- Controll parent -->
  <rect x="152.2" y="135.7" width="98.2" height="162.95" class="f1"/>
  <text x="165" y="210" class="label">1F Controll ™</text>
  <text x="168" y="220" class="label">I2C cable êí</text>

  <!-- 2F Amp array (semi-transparent overlay feel via hatch note) -->
  <!-- x0=13.25+30=43.25, y0=30+40=70 -->
  <!-- Front row -->
  <g id="amps">
    <!-- A1-A5 -->
    <rect x="43.25" y="70" width="41.5" height="58.18" class="f2"/>
    <rect x="88.75" y="70" width="41.5" height="58.18" class="f2"/>
    <rect x="134.25" y="70" width="41.5" height="58.18" class="f2"/>
    <rect x="179.75" y="70" width="41.5" height="58.18" class="f2"/>
    <rect x="225.25" y="70" width="41.5" height="58.18" class="f2"/>
    <!-- A6-A10 -->
    <rect x="43.25" y="132.18" width="41.5" height="58.18" class="f2"/>
    <rect x="88.75" y="132.18" width="41.5" height="58.18" class="f2"/>
    <rect x="134.25" y="132.18" width="41.5" height="58.18" class="f2"/>
    <rect x="179.75" y="132.18" width="41.5" height="58.18" class="f2"/>
    <rect x="225.25" y="132.18" width="41.5" height="58.18" class="f2"/>
    <text x="58" y="100" class="label">A1</text>
    <text x="103.5" y="100" class="label">A2</text>
    <text x="149" y="100" class="label">A3</text>
    <text x="194.5" y="100" class="label">A4</text>
    <text x="240" y="100" class="label">A5</text>
    <text x="58" y="162" class="label">A6</text>
    <text x="103.5" y="162" class="label">A7</text>
    <text x="149" y="162" class="label">A8</text>
    <text x="194.5" y="162" class="label">A9</text>
    <text x="240" y="162" class="label">A10</text>
  </g>
  <text x="100" y="66" class="label">2F Amp◊10 planar 5◊2 (41.5◊58.18, gap 4)</text>

  <!-- duct -->
  <rect x="43" y="194" width="194" height="20" class="duct"/>
  <text x="100" y="207" class="label">cable duct / distributor</text>

  <!-- Power -->
  <rect x="50" y="220" width="55.27" height="44.01" class="pwr"/>
  <text x="58" y="242" class="label">2F Power</text>
  <text x="55" y="252" class="label">55.3◊44.0</text>
  <circle cx="53.52" cy="223.51" r="1.2" class="hole"/>
  <circle cx="101.77" cy="223.51" r="1.2" class="hole"/>
  <circle cx="53.52" cy="260.51" r="1.2" class="hole"/>
  <circle cx="101.77" cy="260.51" r="1.2" class="hole"/>

  <!-- legend -->
  <rect x="30" y="340" width="14" height="8" class="f1"/>
  <text x="48" y="347" class="label">1F boards</text>
  <rect x="110" y="340" width="14" height="8" class="f2"/>
  <text x="128" y="347" class="label">2F Amp</text>
  <rect x="170" y="340" width="14" height="8" class="pwr"/>
  <text x="188" y="347" class="label">Power</text>
  <text x="230" y="347" class="dim">H95 int.</text>
</svg>
